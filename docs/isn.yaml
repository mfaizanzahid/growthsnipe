  /users:
    get:
      summary: Retrieve users
      operationId: getUsers
      tags:
        - Users
      description: |-
        Requires the **OFFICE_ADMIN** privilege.

        Any extra path segment is ignored; the full collection is returned.
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Human-readable detail; empty on success.
                  status:
                    type: string
                    enum:
                      - ok
                      - error
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                required:
                  - status
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/NoAction"
        "500":
          $ref: "#/components/responses/ServerError"
      parameters:
        - name: after
          in: query
          required: false
          schema:
            type:
              - string
              - "null"
        - name: availableonly
          in: query
          required: false
          schema:
            type:
              - string
              - "null"
        - name: showhidden
          in: query
          required: false
          schema:
            type:
              - string
              - "null"
  /users/search:
    get:
      summary: Search users
      operationId: getUsersSearch
      tags:
        - Users
      description: Requires the **OFFICE_ADMIN** privilege.
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    description: Number of records returned.
                  q:
                    description: Type varies; check a sample response.
                  status:
                    type: string
                    enum:
                      - ok
                      - error
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                required:
                  - status
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/NoAction"
        "500":
          $ref: "#/components/responses/ServerError"
      parameters:
        - name: q
          in: query
          required: false
