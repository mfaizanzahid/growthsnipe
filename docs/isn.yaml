openapi: 3.1.0
info:
  title: ISN REST API
  version: "8665"
  summary: Inspection Support Network — legacy REST API.
  description: >
    The legacy REST API for the Inspection Support Network.


    ## Base URL


    Every request is scoped to a **company key** — the tenant slug that
    identifies your

    ISN account:

        https://inspectionsupport.com/{companyKey}/rest

    White-label customers are served from their own domain (for example

    `goisn.net`), so treat both the host and the company key as configurable.


    ## Authentication


    HTTP Basic. Use your **access key** as the username and your **secret access

    key** as the password. Generate them in ISN under *Settings -> My Access
    Keys*

    (`/{companyKey}/access-keys`).


    Two things to know: access keys **do not expire**, and they carry the **full

    privileges of the user who owns them** — there is no per-key scoping. Treat
    them

    as you would that user's password, and issue them from an account whose

    privileges match what the integration actually needs.


    Credentials may also be passed as `username` and `password` query
    parameters.

    That path still works but is **deprecated**, logs a warning server-side, and

    leaks credentials into access logs and browser history. Do not use it.


    ## Sending data


    Content type is **not uniform across verbs**, and getting it wrong fails
    quietly

    rather than with an error:


    | Verb | Accepts |

    |---|---|

    | `GET` | query string |

    | `POST` | `application/json` **or** `application/x-www-form-urlencoded`;
    fields may also be passed as query parameters |

    | `PUT`, `DELETE` | `application/x-www-form-urlencoded` **only** |


    `POST` reads a JSON body only when `Content-Type` begins with
    `application/json`;

    otherwise it reads form fields. `PUT` and `DELETE` accept form encoding only
    — send

    them JSON and every field arrives empty, with a `200` rather than an error.
    The

    report and attachment upload endpoints are the exception: they take the raw
    file as

    the body.


    ## Responses


    There is no single response envelope. Most endpoints return a JSON object
    with a

    `status` field (`ok` or `error`) and a payload key named after the resource,
    but

    this is a convention rather than a guarantee and several endpoints deviate.

    Each operation documents its own shape.


    ## Errors


    An unrecognised endpoint returns **405**, not 404 — worth knowing if you are

    checking for a path's existence. A `400` lists the required fields you left
    out.

    A `403` means your credentials were accepted but the account behind them
    lacks the

    privilege the endpoint needs.


    ## Rate limiting


    This API is **not** rate limited. Please be a considerate client regardless
    —

    poll on a sensible interval, use the `after` filter to fetch only what has
    changed,

    and back off when you see an error.


    ## Path precedence


    Some paths overlap — `/order/complete` and `/order/{id}` are both two
    segments.

    Named segments always win over the parameter form, so `/order/complete` is
    the

    complete-order action and never an order whose id happens to be `complete`.


    ## Scope of this document


    This describes the customer-facing surface only. ISN-internal,
    partner-specific

    and deprecated endpoints are deliberately excluded.
