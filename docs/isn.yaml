paths:
  /agencies:
    get:
      summary: Retrieve agencies
      operationId: getAgencies
      tags:
        - Agencies
      description: Any extra path segment is ignored; the full collection is returned.
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  after:
                    type:
                      - string
                      - "null"
                    description: Echo of the `after` filter, for incremental polling.
                  agencies:
                    type: array
                    items:
                      $ref: "#/components/schemas/Agency"
                  count:
                    type: integer
                    description: Number of records returned.
                  status:
                    type: string
                    enum:
                      - ok
                      - error
                required:
                  - status
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/NoAction"
        "500":
          $ref: "#/components/responses/ServerError"
      parameters:
        - name: after
          in: query
          required: false
          schema:
            type:
              - string
              - "null"
        - name: real_last_change
          in: query
          required: false
          schema:
            type:
              - string
              - "null"
